tags:
  - Contact
summary: Update contacts
operationId: updateContact
description: Update contacts
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 6841738d9abba11274e4c270
requestBody:
  content:
    multipart/form-data:
      schema:
        $ref: ../../../conponents/schemas/contact.yaml
responses:
  '200':
    description: Contact not update
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact not update
            data:
              $ref: ../../../conponents/schemas/contact.yaml
  '201':
    description: Contact update
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact update
            data:
              $ref: ../../../conponents/schemas/contact.yaml
  '401':
    $ref: ../../../conponents/responses/401.yaml

  '404':
    $ref: ../../../conponents/responses/404.yaml

  '500':
    $ref: ../../../conponents/responses/500.yaml
